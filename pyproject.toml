[project]
name = "claude-safe-pipeline"
version = "0.1.0"
description = "Agent pipeline tools. Stdlib only at runtime; the dev group holds the checks."
license = "MIT"
authors = [{ name = "Camarent" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Camarent/claude-safe"
Repository = "https://github.com/Camarent/claude-safe"
Issues = "https://github.com/Camarent/claude-safe/issues"

# One entry per cs-* wrapper in .claude/bin whose target defines a top-level main.
# package = false below: the supported install is the .claude/bin wrappers on PATH; these document the mains.
[project.scripts]
cs-agent-cost = "retro.agent_cost:main"
cs-audit = "audit.audit_run:main"
cs-audit-report = "audit.audit_report:main"
cs-cmd-guard = "cmd_guard:main"
cs-commit = "commit:main"
cs-context-eval = "localmodel.context_eval:main"
cs-docs-index = "docs_index:main"
cs-final-check = "audit.final_check:main"
cs-index-step = "index_step:main"
cs-lead-cost = "retro.lead_cost:main"
cs-ledger = "retro.ledger:main"
cs-localdev = "localmodel.localdev:main"
cs-merge-wave = "merge_wave:main"
cs-model-guard = "model_guard:main"
cs-ops = "ops_steps:main"
cs-pr = "pr_steps:main"
cs-prepare-repo = "pipeline.prepare_repo:main"
cs-ptest = "ptest:main"
cs-qrun = "qrun:main"
cs-qualityrun = "audit.qualityrun:main"
cs-retro = "retro.retro_numbers:main"
cs-review-guard = "review_guard:main"
cs-scans = "audit.scans:main"
cs-servectl = "servectl:main"
cs-testrun = "testrun:main"
cs-ux-run = "ux_run:main"
cs-write-guard = "write_guard:main"
cs-wt = "wt:main"

[dependency-groups]
# Same audit tools as the container image (Dockerfile, /opt/uv-tools) plus lint, types and tests.
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "coverage",
    "vulture",
    "bandit",
    "lizard",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = [".work", ".uv"]

[tool.ruff.lint]
# Start narrow so the baseline is readable; widen one rule family per cleanup commit.
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "I", "C4", "RUF100", "RUF005", "ISC", "PLE", "RUF059", "RUF001", "PLW2901", "PLW1510"]
allowed-confusables = ["ℹ", "×"]   # deliberate symbols in output text (qrun, progress)

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["B011", "SIM115"]

[tool.mypy]
python_version = "3.11"
files = [".claude/tools"]
mypy_path = [".claude/tools"]
ignore_missing_imports = true
check_untyped_defs = false
explicit_package_bases = true

# check_untyped_defs is on for every package and top-level tool module (backlog 53); the tests package is checked too (tests.*)
[[tool.mypy.overrides]]
module = ["audit.*", "localmodel.*", "pipeline.*", "search.*", "retro.*", "brieflint", "cmd_guard", "codenames", "commit", "docs_index", "index_step", "local", "merge_wave", "model_guard", "ops_steps", "orch", "plan", "pr_steps", "ptest", "qrun", "review_guard", "sync_caveman", "testrun", "ux_run", "wave", "wt", "xtools", "tests.*"]
check_untyped_defs = true

# tests monkeypatch on purpose: `lambda: seen.append(x) or y` and `obj.method = fake` are idiomatic there
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["func-returns-value", "method-assign"]

[tool.pytest.ini_options]
testpaths = [".claude/tools/tests"]
python_files = ["test_*.py"]
pythonpath = [".claude/tools"]

[tool.coverage.run]
source = [".claude/tools", "scripts"]
omit = ["*/tests/*"]
branch = true
# tests run many tools as `python3 -I script.py`; measure those child processes too
patch = ["subprocess"]

[tool.coverage.report]
# Ratchet: raise this when coverage rises (host, branch, subprocesses included). `scripts/dev.sh cov` fails below it.
fail_under = 90
show_missing = true
skip_empty = true
