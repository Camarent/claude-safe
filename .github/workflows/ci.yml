name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: git identity for tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch master
      - run: scripts/dev.sh sync
      - name: gitleaks for the binary-dependent tests (same pinned version as the secrets job)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/dev.sh check
      # Stale docs index check (`docs_index.py --fresh`) is not a step here: this repo has no docs/INDEX.md.
      # Add `- run: python3 -I .claude/tools/docs_index.py --root . --fresh` once docs/INDEX.md is committed.
      - run: scripts/dev.sh cov
      - run: test -z "$(scripts/dev.sh dead)"
      - run: scripts/dev.sh sec
      - run: scripts/dev.sh ccn

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: personal-address blocklist
        env:
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: |
          if [ -z "$PRIVACY_BLOCKLIST" ]; then
            echo "::notice::PRIVACY_BLOCKLIST secret not set, check skipped"
            exit 0
          fi
          rc=0
          if git grep -lIiE "$PRIVACY_BLOCKLIST"; then
            echo "::error::blocklisted pattern found in the files listed above"
            rc=1
          fi
          if git log --all --format='%an %ae %cn %ce%n%B' | grep -qiE "$PRIVACY_BLOCKLIST"; then
            echo "::error::blocklisted pattern found in git history (authors or messages)"
            rc=1
          fi
          exit $rc
